# =============================================================================
# NIMBUS — VIRTUAL HOST CONFIG
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # -------------------------------------------------------------------------
    # REQUEST ID — trace every request
    # -------------------------------------------------------------------------
    add_header X-Request-ID $request_id always;

    # -------------------------------------------------------------------------
    # API ROUTES — proxy to API Gateway
    # -------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # AI ROUTES — stricter rate limit
    # -------------------------------------------------------------------------
    location /api/v1/ai/ {
        limit_req zone=ai burst=5 nodelay;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # Longer timeout for AI streaming responses
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Cache-Control no-cache;
    }

    # -------------------------------------------------------------------------
    # AUTH ROUTES — strictest rate limit
    # -------------------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # HEALTH CHECK — no rate limit, no logging
    # -------------------------------------------------------------------------
    location /health {
        access_log off;
        proxy_pass http://api_gateway/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # -------------------------------------------------------------------------
    # FRONTEND — proxy to Next.js
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # ERROR PAGES
    # -------------------------------------------------------------------------
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
